<style>
  :root {
    --bg: #0A0A0B;
    --panel: #131315;
    --line: #2B2B2F;
    --text: #EDEDE6;
    --dim: #9A9A92;
    --lime: #C8FF2E;
    --pink: #FF2D95;
    --cyan: #19E3FF;
    --orange: #FF6A1F;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }

  body {
    color: var(--text);
    font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

  .mono-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .shell {
    max-width: 1200px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  /* Status bar */
  .status {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 24px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
  }
  .status b { color: var(--lime); font-weight: 700; }
  .status .live::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 8px;
    background: var(--pink);
    vertical-align: 0;
  }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* Hero slab */
  .hero {
    flex: 1;
    position: relative;
    background: var(--lime);
    color: var(--bg);
    padding: 24px 24px 20px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .hero .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .hero .serial { max-width: 60%; }

  .barcode {
    width: 150px;
    height: 44px;
    flex: none;
    background:
      repeating-linear-gradient(90deg,
        var(--bg) 0 2px, transparent 2px 5px,
        var(--bg) 5px 6px, transparent 6px 10px,
        var(--bg) 10px 14px, transparent 14px 16px,
        var(--bg) 16px 17px, transparent 17px 21px);
  }

  h1 {
    margin: auto 0 0;
    font-family: 'Archivo', 'Arial Black', sans-serif;
    font-stretch: 125%;
    font-weight: 900;
    font-size: clamp(54px, min(15.4vw, 28vh), 190px);
    line-height: 0.82;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    margin-left: -0.04em;
  }
  h1 .dot { color: var(--pink); }

  .hero .bottom {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: flex-end;
    gap: 16px 32px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 3px solid var(--bg);
  }
  .reg { display: flex; gap: 14px; }
  .reg svg { width: 26px; height: 26px; }

  /* Links */
  .links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .slab {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
    min-height: 150px;
    padding: 16px 24px 20px;
    text-decoration: none;
    color: var(--bg);
    transition: background 120ms ease, color 120ms ease;
  }
  .slab.pink { background: var(--pink); }
  .slab.cyan { background: var(--cyan); }
  .slab:hover, .slab:focus-visible { background: var(--text); }
  .slab .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .slab svg { width: 44px; height: 44px; flex: none; }
  .slab .name {
    display: block;
    font-family: 'Archivo', Arial, sans-serif;
    font-stretch: 125%;
    font-weight: 900;
    font-size: clamp(32px, min(6vw, 9vh), 72px);
    line-height: 0.9;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .slab .addr {
    display: block;
    margin-top: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    overflow-wrap: anywhere;
  }

  /* Hazard + ticker */
  .hazard {
    height: 12px;
    background: repeating-linear-gradient(-45deg, var(--lime) 0 14px, var(--bg) 14px 28px);
  }
  .ticker {
    overflow: hidden;
    white-space: nowrap;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 0;
  }
  .ticker-track {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 28s linear infinite;
    font-family: 'Archivo', Arial, sans-serif;
    font-stretch: 112%;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .ticker-track span { margin-right: 48px; }
  .ticker-track .hot { color: var(--pink); }
  @keyframes scroll { to { transform: translateX(-100%); } }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 24px;
    padding: 10px 24px 12px;
    color: var(--dim);
  }

  @media (max-width: 860px) {
  }
  @media (max-width: 600px) {
    .status, footer { padding-left: 16px; padding-right: 16px; }
    .hero { padding: 16px 16px 16px; min-height: 130px; }
    .status { padding-top: 8px; padding-bottom: 8px; }
    .ticker { padding: 6px 0; }
    .ticker-track { font-size: 18px; }
    .hero .serial { max-width: 100%; }
    .barcode { display: none; }
    .links { grid-template-columns: 1fr; }
    .slab { min-height: 0; flex: 1; gap: 12px; padding: 14px 16px; }
    .links { flex: 0 0 auto; }
    .slab .name { font-size: clamp(28px, min(8vh, 11vw), 56px); }
    .slab svg { width: 28px; height: 28px; }
    .slab .addr { margin-top: 4px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; padding-left: 16px; white-space: normal; }
    .slab { transition: none; }
  }
</style>
</head>

      <span>rimidar.au</span><span class="hot">///</span>

</div>
